# How `make generate` writes the code under gen/ (ADR 0008 in paddock), with no
# network call to buf.build, so a laptop and CI write the same code:
# - Go, in gen/go: protoc-gen-go is a local plugin, the version tools/go.mod
#   pins, run with `go tool`; and protoc-gen-connect-go beside it, for the
#   services (paddock#121's PitwallService), in a <package>connect directory
#   beside each package that has one. It writes nothing for a file with no
#   service.
# - Python, in gen/python/twr: protobuf's own generators, `python` and `pyi`
#   (the type stubs), which are built into protoc. scripts/protoc.py runs the
#   protoc release it pins, fetched once and checked by its digest
#   (paddock#265). The rest of gen/python, the package around the generated
#   code, is written by hand.
# The generated files are committed; CI's `test` fails when they are not what
# buf generates from proto/.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/those-who-run/contracts/gen/go
plugins:
  - local: ["go", "tool", "-modfile=tools/go.mod", "google.golang.org/protobuf/cmd/protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/go.mod", "connectrpc.com/connect/cmd/protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  - protoc_builtin: python
    protoc_path: ["python3", "scripts/protoc.py"]
    out: gen/python
  - protoc_builtin: pyi
    protoc_path: ["python3", "scripts/protoc.py"]
    out: gen/python
