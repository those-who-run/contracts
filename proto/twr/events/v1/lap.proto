syntax = "proto3";

package twr.events.v1;

// PitRole is what a lap had to do with the pits.
enum PitRole {
  // Not set.
  PIT_ROLE_UNSPECIFIED = 0;
  // The lap had nothing to do with the pits.
  PIT_ROLE_NONE = 1;
  // The lap ended in the pits.
  PIT_ROLE_IN_LAP = 2;
  // The lap started from the pits.
  PIT_ROLE_OUT_LAP = 3;
  // The lap started from the pits and ended in them.
  PIT_ROLE_IN_AND_OUT = 4;
}

// LapCompleted says a lap ended: the lap counter moved on, or the session ended
// part way through it.
message LapCompleted {
  // The session's id, as in its SessionStarted.
  string session_id = 1;
  // The lap's number, from 1.
  int32 lap = 2;
  // The lap's time, in milliseconds; an int32 holds about 24 days (v1's
  // `lap_time_ms`). 0 when the lap was not timed: a partial lap, which has no
  // time. The lap an ecu restart fell in (paddock#76) is not complete but has
  // GT7's time for it, as v1 stored it.
  int32 lap_time_ms = 3;
  // Whether it was a full lap, from line to line, rather than a partial one:
  // false for the lap a session ended in part way. The lap ecu joined a
  // session in counts as complete, with the game's time for it, as v1 stored
  // it (kept for parity with v1, paddock#276).
  bool complete = 4;
  // The fuel in the tank when the lap started, in litres (v1's `fuel_start`).
  double fuel_at_start = 5;
  // The fuel in the tank when the lap ended, in litres (v1's `fuel_end`).
  double fuel_at_end = 6;
  // The fuel the lap used, in litres: fuel_at_start minus fuel_at_end,
  // rounded to 3 decimals, as v1 computed it. It is negative for a lap in
  // which the car was refuelled. SessionSummary's fuel_used is the sum of
  // these rounded values.
  double fuel_used = 7;
  // The car's position when the lap ended, from 1. Absent outside a field,
  // when ecu's verdict on the session's type at the lap's end is
  // SESSION_TYPE_SOLO_LAPS or SESSION_TYPE_SOLO_TIMED, and when the game
  // reported no position. This differs from v1 on purpose: GT7 reports 1 in a
  // solo session and v1 stored it; the parity harness (paddock#40) maps it.
  optional int32 position = 8;
  // What the lap had to do with the pits (PitRole; v1's `pit`: null, `in`,
  // `out` or `in_out`).
  PitRole pit_role = 9;
  // The `seq` of the lap's first frame, in the ecu run that published this
  // event. With last_seq it bounds the lap's frames (v1's `frames` counted
  // them). For the lap an ecu restart fell in (paddock#76), whose first
  // frames the earlier run saw, it is the continuing run's first frame of the
  // lap. A seq means something only within the run that published the event,
  // so in SessionSummary's laps the seqs of laps from different runs are not
  // comparable.
  uint32 first_seq = 10;
  // The `seq` of the lap's last frame, in the same run: the event's `at`.
  uint32 last_seq = 11;
  // Whether the lap counts for the session's best, by GT7's rule as v1's
  // lap_time rule reads it (paddock#83): a complete lap that is neither an
  // in-lap nor an out-lap (pit_role) counts, except lap 1 when GT7 leaves it
  // out. GT7 leaves out a start lap from a grid ahead of the line: lap 1 of a
  // session with a lap total (a lap race or solo laps) never counts, and lap
  // 1 of a timed session counts only when GT7
  // set its own best on the frame that posted lap 1's time (qualifying, out
  // of the pits onto the line, does; a timed race from a grid does not, so
  // its best stays blank, as at Suzuka East on 2026-10-16 and Suzuka on
  // 2026-10-18). So ecu knows it when the lap ends. v1 did not store it.
  bool counts_for_best = 12;
}

// LapBestChanged says the session's best lap changed: a lap that counts for
// best (LapCompleted's counts_for_best) beat the best before it, or GT7's own
// best, which wins when it has one, moved. GT7's best can replace ecu's
// earlier one with a slower lap, so the new best is not always quicker:
// gap_ms is then negative. Published once per lap at most.
message LapBestChanged {
  // The session's id, as in its SessionStarted.
  string session_id = 1;
  // The new best lap's number, from 1.
  int32 lap = 2;
  // The new best lap's time, in milliseconds: GT7's own best when it has
  // one, else the lap's time (v1's `best_lap_ms` once the session ends).
  int32 lap_time_ms = 3;
  // The best lap's time before this one, in milliseconds. Absent for the
  // session's first best.
  optional int32 previous_best_ms = 4;
  // How much quicker the new best is than the one before, in milliseconds:
  // previous_best_ms less lap_time_ms. Negative when GT7's own best replaced
  // a quicker one ecu had counted. Absent with previous_best_ms.
  optional int32 gap_ms = 5;
  // The `seq` of the frame the lap ended on, in the ecu run that published
  // this event: the event's `at`, its lap.completed's last_seq.
  uint32 at = 6;
}
