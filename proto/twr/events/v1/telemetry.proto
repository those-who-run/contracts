syntax = "proto3";

package twr.events.v1;

import "twr/telemetry/v1/frame.proto";

// TelemetryLost says the frames stopped arriving (paddock#70; v1's
// App._watchdog logging "telemetry lost"): no packet for ecu's timeout (v1's
// GT7_TELEMETRY_TIMEOUT_SECS, 3 s, checked once a second), after at least one
// frame in this ecu run. ecu publishes it on
// twr.v1.<src>.evt.<sid>.telemetry.lost while a session is open, and on
// twr.v1.<src>.evt._.telemetry.lost while none is, so a consumer can subscribe to every loss without knowing the session.
// Silence in a menu is normal: v1 said "Lost telemetry." only when the last
// frame was in a race or paused (v1's TelemetryVoice), which phase tells. Lost
// in a pause, the session then ends paused, with END_REASON_TELEMETRY_LOST
// (v1's Engine.feed_lost); lost while driving, it stays open.
message TelemetryLost {
  // The open session's id, as in its SessionStarted. Empty when no session is
  // open, on the evt._ subject.
  string session_id = 1;
  // The ecu run's id, the ULID ecu mints when it starts: the <run> in the
  // event's id. It says which run's seqs at counts in, which no session does
  // on the evt._ subject.
  string run_id = 2;
  // Where the game was on the last frame before the loss
  // (twr.telemetry.v1.Phase).
  twr.telemetry.v1.Phase phase = 3;
  // The time from the last frame to the moment ecu called it lost, in
  // milliseconds: at least ecu's timeout (v1's GT7_TELEMETRY_TIMEOUT_SECS).
  int32 silence_ms = 4;
  // The `seq` of the last frame before the loss, in the ecu run that
  // published this event: the event's `at`.
  uint32 at = 5;
}

// TelemetryRestored says the frames came back after a TelemetryLost in the
// same ecu run (paddock#70; v1's App._watchdog logging "telemetry connected",
// and v1's "Telemetry back."). Published, like TelemetryLost, on
// twr.v1.<src>.evt.<sid>.telemetry.restored while a session is open and on
// twr.v1.<src>.evt._.telemetry.restored while none is: the two can differ, as
// when the loss ended the session in a pause.
message TelemetryRestored {
  // The open session's id, as in its SessionStarted. Empty when no session is
  // open, on the evt._ subject.
  string session_id = 1;
  // The ecu run's id, as in its TelemetryLost: the <run> in the event's id.
  string run_id = 2;
  // The `at` of the TelemetryLost it ends: the last frame before the gap.
  uint32 lost_at = 3;
  // The gap, in milliseconds: from the last frame before it to the first
  // after it, by their receive times.
  int32 gap_ms = 4;
  // The `seq` of the first frame after the gap, in the ecu run that published
  // this event: the event's `at`.
  uint32 at = 5;
  // Where the game was on the last frame before the gap, as in its
  // TelemetryLost (twr.telemetry.v1.Phase), so a reader such as radio can
  // decide "Telemetry back." (v1's TelemetryVoice) without having seen the
  // TelemetryLost, which may be on the other subject.
  twr.telemetry.v1.Phase lost_phase = 6;
}
