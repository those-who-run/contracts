# A KV key, as paddock#72 adds: twr.state.v1.EcuStatus in the live bucket. The
# test adds it to the real subjects.yaml and registers that message.
subjects:
  - kv: live
    key: ecu.status.<src>
    message: twr.state.v1.EcuStatus
    content_type: application/json
    producers: [ecu]
    consumers: [pitwall, dash]
    description: ecu's status, one key per source.
