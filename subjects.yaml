# The catalogue of NATS subjects and KV keys (ADR 0002, point 5, in paddock):
# one entry per subject pattern or KV key, with the message it carries and how
# it travels. A consumer subscribes by pattern and decodes by ce-type, so a
# subject is as much a part of the contract as its message.
#
# internal/catalogue's tests check every entry (paddock#25): the message exists
# in the generated code; a ce-type and a message are one to one, though a
# message may travel on several subjects; a pattern follows ADR 0001's subject
# scheme and goes to that scheme's stream; every placeholder is a known one and
# allowed where it is; and every message in an events package (twr.events.*, any
# version) has an entry or is listed under helpers. docs/subjects.md is
# rendered from this file by `make generate`.
#
# An entry is a subject or a KV key. A subject's keys:
#   pattern       the subject, with <placeholders> for its variable tokens
#                 (docs/subjects.md lists them). An event published while no
#                 session is open has _ in place of <sid> (paddock#70).
#                 Callouts are one entry per level, callout.p0, .p1 and .p2,
#                 each a subject a consumer subscribes to, sharing one message
#                 and ce-type.
#   ce_type       the CloudEvents type in the ce-type header, one to one with
#                 a message: run.thosewho.<area>.<what>.v<N>
#   message       the protobuf message, fully qualified
#   content_type  the ce-datacontenttype header: application/json, protobuf's
#                 JSON form (ADR 0002, point 2)
#   stream        the JetStream stream that captures the subject (ADR 0001,
#                 point 1)
#   producers     the components that publish it
#   consumers     the components that read it
#   msg_id        the ce-id and Nats-Msg-Id scheme. An event's is
#                 <src>:<sid>:<area>.<what>:<part>, with its ce-type's
#                 <area>.<what> and at least one part, such as
#                 <src>:<sid>:lap.completed:<n>; one that happens once per
#                 session ends in :1. One that can happen at any frame,
#                 more than once a session, ends in <run>:<seq>, the ecu run
#                 and the event's `at`: seq starts again with each run, and a
#                 session continued after an ecu restart (paddock#76) spans
#                 two runs. On an evt._ subject, with no session
#                 open, <run> takes <sid>'s place. The source comes first
#                 because EVENTS deduplicates by Nats-Msg-Id across the whole
#                 stream, and two sources can carry the same session id
#                 (paddock#279). A frame's is <run>:frame:<seq>, without it.
#   description   what it is, for the rendered table
#
# A KV key's: kv (the bucket), key (with placeholders), message, content_type,
# producers (its writers), consumers (its readers) and description. It has no
# pattern, stream, ce_type or msg_id: a value written with Put carries no
# headers.
#
# helpers lists the messages in an events package that are parts of an event,
# not events, so they need no entry.

subjects:
  - pattern: twr.v1.<src>.frame.gt7
    ce_type: run.thosewho.frame.gt7.v1
    message: twr.telemetry.v1.Frame
    content_type: application/json
    stream: TELEMETRY
    producers: [ecu]
    consumers: [logbook]
    msg_id: <run>:frame:<seq>
    description: Every decoded GT7 packet, about 60 a second.

  - pattern: twr.v1.<src>.evt.<sid>.session.started
    ce_type: run.thosewho.session.started.v1
    message: twr.events.v1.SessionStarted
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:session.started:1
    description: A session began.

  - pattern: twr.v1.<src>.evt.<sid>.lap.completed
    ce_type: run.thosewho.lap.completed.v1
    message: twr.events.v1.LapCompleted
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:lap.completed:<n>
    description: A lap ended, complete or partial.

  - pattern: twr.v1.<src>.evt.<sid>.session.ended
    ce_type: run.thosewho.session.ended.v1
    message: twr.events.v1.SessionEnded
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook, podium]
    msg_id: <src>:<sid>:session.ended:1
    description: A session ended, why, and its summary.

  - pattern: twr.v1.<src>.evt.<sid>.session.continued
    ce_type: run.thosewho.session.continued.v1
    message: twr.events.v1.SessionContinued
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:session.continued:<run>
    description: A new ecu run continued the session the run before it left open, after a gap.

  - pattern: twr.v1.<src>.evt.<sid>.session.discarded
    ce_type: run.thosewho.session.discarded.v1
    message: twr.events.v1.SessionDiscarded
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:session.discarded:1
    description: A held start was a GT7 replay or demo, not a drive; its held frames are dropped.

  - pattern: twr.v1.<src>.evt.<sid>.session.kind
    ce_type: run.thosewho.session.kind.v1
    message: twr.events.v1.SessionKindChanged
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:session.kind:<run>:<seq>
    description: ecu's verdict on the session's kind changed.

  - pattern: twr.v1.<src>.evt.<sid>.session.track
    ce_type: run.thosewho.session.track.v1
    message: twr.events.v1.SessionTrackChanged
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:session.track:<run>:<seq>
    description: ecu's verdict on the session's track changed.

  - pattern: twr.v1.<src>.evt.<sid>.session.paused
    ce_type: run.thosewho.session.paused.v1
    message: twr.events.v1.SessionPaused
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:session.paused:<run>:<seq>
    description: The session paused, flagged by GT7 or read from a frozen stream.

  - pattern: twr.v1.<src>.evt.<sid>.session.resumed
    ce_type: run.thosewho.session.resumed.v1
    message: twr.events.v1.SessionResumed
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:session.resumed:<run>:<seq>
    description: The session's pause ended.

  - pattern: twr.v1.<src>.evt.<sid>.lap.best
    ce_type: run.thosewho.lap.best.v1
    message: twr.events.v1.LapBestImproved
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:lap.best:<n>
    description: The session's best lap improved.

  - pattern: twr.v1.<src>.evt.<sid>.race.final_lap
    ce_type: run.thosewho.race.final_lap.v1
    message: twr.events.v1.RaceFinalLapStarted
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:race.final_lap:1
    description: The final lap of a lap race began.

  - pattern: twr.v1.<src>.evt.<sid>.race.position
    ce_type: run.thosewho.race.position.v1
    message: twr.events.v1.RacePositionChanged
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:race.position:<run>:<seq>
    description: The car's position changed and settled for 3 s.

  - pattern: twr.v1.<src>.evt.<sid>.race.finished
    ce_type: run.thosewho.race.finished.v1
    message: twr.events.v1.RaceFinished
    content_type: application/json
    stream: EVENTS
    producers: [ecu]
    consumers: [logbook]
    msg_id: <src>:<sid>:race.finished:1
    description: The race finished, at the chequered flag or a timed race's finish.

helpers:
  - twr.events.v1.PitStop
  - twr.events.v1.SessionGap
  - twr.events.v1.SessionKind
  - twr.events.v1.SessionSummary
  - twr.events.v1.TrackCandidate
  - twr.events.v1.TrackVerdict
